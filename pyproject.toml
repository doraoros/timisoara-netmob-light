[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timisoara-netmob-light"
version = "0.1.0"
description = "Radio + GPS mobility dataset and handoff models for Timișoara"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "folium>=0.15",
    "pyarrow>=14.0",
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "python-docx>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Teste (pytest).
test = ["pytest>=7.0"]
# Modele secvențiale profunde + explainability (vezi scripts/experiment_sequential.py).
deep = [
    "torch>=2.2",
    "shap>=0.45",
]

[project.scripts]
netmob-build-dataset = "src.utils.build_radio_gps_dataset:main"
netmob-train-handoff = "src.models.train_handoff_models:main"
netmob-validate = "src.utils.validate_dataset:main"
netmob-thesis-figures = "src.reports.generate_thesis_figures:main"
netmob-dissertation = "src.reports.generate_dissertation_bundle:main"

[tool.setuptools]
packages = [
    "src",
    "src.parsing",
    "src.features",
    "src.models",
    "src.utils",
    "src.viz",
    "src.reports",
]
